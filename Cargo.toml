[package]
name = "rusturbo"
version = "0.1.2"
edition = "2021"
rust-version = "1.74"
description = "RustTurbo — extreme Rust compilation accelerator: first-build acceleration, shared dependency artifact cache, linker engine and evidence-based benchmarking"
license = "MIT"
repository = "https://github.com/the-golden-army/Rusturbo"
default-run = "rusturbo"

[[bin]]
name = "rusturbo"
path = "src/main.rs"

# Only the tool itself is a workspace member. The Actix demos are deliberately
# standalone: `cargo install --git <repo>` installs every binary package it finds in the
# workspace, so keeping a demo member here makes the bare command fail with
# "multiple packages with binaries found: actix-hello, rusturbo".
[workspace]
members = ["."]
resolver = "2"

[dependencies]
anyhow = "1"
cargo_metadata = "0.18"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
opt-level = 3
codegen-units = 1
